name: Bootstrap Clintware Consulting

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore verified site package
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/clintware-consulting.zip
          echo "d0b63daeeb17894b01d0951afb3b5b700f627527b6b29af2f73e244d3213d080  /tmp/clintware-consulting.zip" | sha256sum --check -
          unzip -oq /tmp/clintware-consulting.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install beautifulsoup4 tinycss2

      - name: Run five regression checks
        run: python tests/regression.py

      - name: Commit production site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Clintware Consulting site"
          git push
