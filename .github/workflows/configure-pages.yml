name: Configure Clintware Consulting Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-pages.yml"
  workflow_dispatch:

permissions: write-all

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages API and custom domain
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          api="https://api.github.com/repos/${REPOSITORY}/pages"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          get_code=$(curl -sS -o /tmp/pages-get.json -w "%{http_code}" "${headers[@]}" "$api")
          create_code="not-needed"

          if [ "$get_code" = "404" ]; then
            create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST "${headers[@]}" "$api" \
              -d '{"build_type":"workflow"}')
          fi

          update_code=$(curl -sS -o /tmp/pages-update.json -w "%{http_code}" -X PUT "${headers[@]}" "$api" \
            -d '{"build_type":"workflow","cname":"consulting.clintware.com"}')

          final_code=$(curl -sS -o /tmp/pages-final.json -w "%{http_code}" "${headers[@]}" "$api")

          message() {
            local file="$1"
            if [ -s "$file" ]; then
              jq -r '.message // .status // "No response message"' "$file" 2>/dev/null || echo "Unparseable response"
            else
              echo "Empty response"
            fi
          }

          {
            echo "# GitHub Pages Setup Result"
            echo
            echo "- Repository: \`${REPOSITORY}\`"
            echo "- Initial GET: \`${get_code}\`"
            echo "- Create: \`${create_code}\`"
            echo "- Update custom domain/build type: \`${update_code}\`"
            echo "- Final GET: \`${final_code}\`"
            echo "- Final message/status: \`$(message /tmp/pages-final.json)\`"
            echo
            if [ "$final_code" = "200" ]; then
              echo "Pages API configuration succeeded."
              echo
              echo '```json'
              jq '{status, cname, html_url, build_type, https_enforced, protected_domain_state}' /tmp/pages-final.json 2>/dev/null || true
              echo '```'
            else
              echo "Pages API configuration did not complete."
              echo
              echo "Create response: \`$(message /tmp/pages-create.json)\`"
              echo "Update response: \`$(message /tmp/pages-update.json)\`"
            fi
          } > PAGES_SETUP_RESULT.md

      - name: Commit setup result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAGES_SETUP_RESULT.md
          git commit -m "Record GitHub Pages configuration result"
          git push
