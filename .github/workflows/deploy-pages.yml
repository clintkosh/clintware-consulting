name: Retire legacy Clintware Pages site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Disable the retired GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/pages" --silent 2>&1) || {
            echo "Pages removal API failed: $code"
            exit 1
          }
          echo "GitHub Pages retirement requested."

      - name: Verify Pages is disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/pages" --include 2>&1 || true)
          if echo "$code" | grep -q "404 Not Found"; then
            echo "Verified: retired Pages site is disabled."
          else
            echo "Pages endpoint did not confirm 404 after disable."
            echo "$code" | head -c 1500
            exit 1
          fi
