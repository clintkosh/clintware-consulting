name: Retire legacy public site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: retired-clintware-pages
  cancel-in-progress: true

jobs:
  retire:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare a 404-only artifact
        run: |
          mkdir -p _site
          cat > _site/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex,nofollow">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Site retired</title>
          </head>
          <body></body>
          </html>
          HTML

      - name: Check retired artifact
        run: |
          test -f _site/404.html
          test ! -f _site/index.html
          ! grep -Eiq 'consulting|consultant|consultancy' _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload 404-only artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish retired artifact
        id: deployment
        uses: actions/deploy-pages@v4
